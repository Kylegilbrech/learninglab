<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1200px; height:630px; }
  body {
    position:relative; overflow:hidden;
    background:
      radial-gradient(120% 90% at 50% -10%, #12203c 0%, #0a1120 55%, #070b16 100%);
    font-family: "Arial Narrow", Arial, Helvetica, sans-serif;
    color:#eef3ff;
  }
  /* field yard lines */
  .field { position:absolute; inset:0; opacity:.16; }
  .field .line { position:absolute; top:0; bottom:0; width:3px; background:#cfe0ff; }
  .field .h { position:absolute; left:0; right:0; height:2px; background:#cfe0ff; opacity:.5; }
  .endzone { position:absolute; left:0; right:0; height:78px;
    background:linear-gradient(90deg, rgba(43,140,255,.35), rgba(43,140,255,.05)); }
  .endzone.top { top:0; } .endzone.bottom { bottom:0; transform:scaleX(-1); }
  .wrap { position:relative; z-index:2; height:100%;
    display:flex; flex-direction:column; justify-content:center; padding:0 84px; }
  .badge { display:inline-flex; align-items:center; gap:14px; margin-bottom:26px; }
  .chip { width:64px; height:64px; border-radius:16px;
    background:linear-gradient(145deg,#2b8cff,#1f6fe0);
    display:flex; align-items:center; justify-content:center;
    font-weight:900; font-size:40px; color:#fff;
    box-shadow:0 10px 30px rgba(43,140,255,.45); font-family:Arial,sans-serif; }
  .kicker { font-size:26px; letter-spacing:6px; text-transform:uppercase;
    color:#8fb4ff; font-weight:700; }
  h1 { font-size:132px; line-height:.92; font-weight:900;
    letter-spacing:-1px; text-transform:uppercase;
    font-family: "Arial Black", Arial, sans-serif;
    background:linear-gradient(180deg,#ffffff,#b9ccf0);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 6px 40px rgba(0,0,0,.4); }
  h1 .l2 { color:transparent; }
  p.sub { margin-top:30px; font-size:36px; font-weight:600; color:#c7d5f0;
    font-family:Arial,Helvetica,sans-serif; max-width:900px; }
  .pills { margin-top:34px; display:flex; gap:16px; }
  .pill { font-family:Arial,sans-serif; font-size:24px; font-weight:700;
    padding:12px 22px; border-radius:999px;
    background:rgba(43,140,255,.16); border:1px solid rgba(43,140,255,.4);
    color:#dbe7ff; }
  .glow { position:absolute; width:640px; height:640px; right:-160px; bottom:-220px;
    background:radial-gradient(circle, rgba(43,140,255,.35), transparent 60%);
    filter:blur(10px); z-index:1; }
</style>
</head>
<body>
  <div class="field" id="field"></div>
  <div class="endzone top"></div>
  <div class="endzone bottom"></div>
  <div class="glow"></div>
  <div class="wrap">
    <div class="badge">
      <div class="chip">G</div>
      <div class="kicker">Salary-Cap Football</div>
    </div>
    <h1>Gridiron<br><span class="l2">Fantasy</span></h1>
    <p class="sub">Draft your squad under the cap. Set your formation. Chase the high score.</p>
    <div class="pills">
      <div class="pill">Free &amp; instant</div>
      <div class="pill">No signup</div>
      <div class="pill">Plays in your browser</div>
    </div>
  </div>
  <script>
    const f = document.getElementById('field');
    for (let i=1;i<10;i++){ const d=document.createElement('div'); d.className='line'; d.style.left=(i*120)+'px'; f.appendChild(d); }
    for (let i=1;i<6;i++){ const d=document.createElement('div'); d.className='h'; d.style.top=(i*105)+'px'; f.appendChild(d); }
  </script>
</body>
</html>
