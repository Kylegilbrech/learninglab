name: Android Build

# Builds the Gridiron Fantasy Android app.
#   • Always builds a DEBUG apk you can install directly on a phone (Actions → run → Artifacts).
#   • Also builds a signed RELEASE .aab for Google Play IF you add the signing secrets below.
#
# Trigger it from the GitHub "Actions" tab (Run workflow), or it runs automatically
# when app files change on the feature branch.
#
# To enable the signed Play-ready AAB, add these repo secrets
# (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64  – `base64 -w0 your-upload.keystore`
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD

on:
  workflow_dispatch:
  push:
    branches: [ "claude/football-app-google-play-98gd6n" ]
    paths:
      - "www/**"
      - "resources/**"
      - "capacitor.config.json"
      - "package.json"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Mapped at job level so the signing step's `if` can see whether a keystore was provided.
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" >/dev/null

      - name: Install dependencies
        run: npm install

      - name: Add Android platform + sync web assets
        run: |
          npx cap add android
          npx cap sync android

      - name: Generate launcher icons + splash
        run: npx capacitor-assets generate --android || echo "asset generation skipped"

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gridiron-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Configure release signing
        id: signing
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          cat >> android/app/build.gradle <<'GRADLE'

          // --- injected by CI for release signing ---
          android {
              signingConfigs {
                  release {
                      storeFile file("release.keystore")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          GRADLE
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build signed release AAB
        if: ${{ steps.signing.outputs.signed == 'true' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Upload release AAB
        if: ${{ steps.signing.outputs.signed == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: gridiron-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
